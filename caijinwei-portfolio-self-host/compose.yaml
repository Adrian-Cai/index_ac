services:
  portfolio:
    image: ${PORTFOLIO_IMAGE:?PORTFOLIO_IMAGE is required}
    container_name: caijinwei-portfolio
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
